{% extends "budget/base.html" %}
{% load static %}
{% block title %}Операции{% endblock %}
{% block content %}
<section class="page-heading">
    <h1>Финансовые операции</h1>
    <p class="muted">Операции загружаются через AJAX. Поиск, сортировка и пагинация выполняются на стороне сервера.</p>
</section>

<div class="actions">
    <a class="button" href="{% url 'add_transaction' %}">Добавить операцию</a>
</div>

<section class="ajax-panel">
    <div class="ajax-controls">
        <label>
            Поиск
            <input id="searchInput" type="text" placeholder="Категория, участник, счет, комментарий">
        </label>

        <label>
            Сортировка
            <select id="sortSelect">
                <option value="-date">Сначала новые</option>
                <option value="date">Сначала старые</option>
                <option value="-amount">Сумма по убыванию</option>
                <option value="amount">Сумма по возрастанию</option>
                <option value="category">Категория А-Я</option>
                <option value="-category">Категория Я-А</option>
                <option value="member">Участник А-Я</option>
                <option value="-member">Участник Я-А</option>
                <option value="-id">ID по убыванию</option>
                <option value="id">ID по возрастанию</option>
            </select>
        </label>

        <label>
            На странице
            <select id="perPageSelect">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
            </select>
        </label>

        <button id="applyFiltersBtn" type="button">Применить</button>
    </div>

    <div id="loadingIndicator" class="loading hidden">Загрузка данных...</div>
    <div id="errorBox" class="ajax-error hidden"></div>
    <div id="transactionsContainer" class="list"></div>
    <div id="paginationContainer" class="pagination"></div>
</section>

<script src="{% static 'budget/js/transactions_ajax.js' %}"></script>
{% endblock %}
