{% extends "budget/base.html" %}
{% block content %}
<h1>Счета и валюты</h1>
<form method="post" class="form wide">{% csrf_token %}{{ form.as_p }}<button>Добавить счет</button></form>
<div class="list">{% for item in items %}
<div class="list-item"><div><b>{{ item.name }}</b><div class="muted">{{ item.currency }} · курс: {{ item.exchange_rate_to_rub }}</div></div><a class="delete" href="{% url 'delete_wallet' item.id %}">Удалить</a></div>
{% endfor %}</div>
{% endblock %}
