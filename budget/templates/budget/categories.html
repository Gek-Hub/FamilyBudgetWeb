{% extends "budget/base.html" %}
{% block content %}
<h1>Категории</h1>
<form method="post" class="form wide">{% csrf_token %}{{ form.as_p }}<button>Добавить категорию</button></form>
<div class="list">{% for item in items %}
<div class="list-item"><div><b>{{ item.name }}</b><div class="muted">{{ item.type }}</div></div><a class="delete" href="{% url 'delete_category' item.id %}">Удалить</a></div>
{% endfor %}</div>
{% endblock %}
